<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 3 Cot Chung Hang</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        #khung {
            width: 1000px;
            height: 900px;
            margin: 20px auto;
            border: 2px solid blue;
        }

        #header {
            width: 100%;
            height: 50px;
            border-bottom: 2px solid orange;
        }

        #menungang {
            width: 100%;
            height: 30px;
            background-color: lightgray;
            border-bottom: 2px solid pink;
        }

       #menudoc {
    width: 200px;
    height: 360px; /* Chiều cao cố định */
    background-color: lightblue;
    float: left;
}

#content1 {
    width: 400px;
    height: 360px; /* Chiều cao cố định */
    background-color: rgb(221, 39, 69);
    float: left;
}

#content2 {
    width: 400px;
    height: 360px; /* Chiều cao cố định */
    background-color: lightyellow;
    float: left;
}

        #footer {
            width: 100%;
            height: 50px;
            background-color: lightgreen;
            clear: both;
        }
    </style>
</head>

<body>

    <div id="khung">
        <div id="header">Header</div>
        <div id="menungang">Menu ngang</div>
        
   
        <div id="menudoc">Menu dọc (200px)</div>
        <div id="content1">Content 1 (400px)</div>
        <div id="content2">Content 2 (400px)</div>
        
        <div id="footer">Footer</div>
    </div>

</body>
</html>
