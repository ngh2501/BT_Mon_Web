<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>
    <form>
        <table style="border: 1px solid #4a90e2; padding: 15px; width: 250px;">
            <tr>
                <td>Name:</td>
            </tr>
            <tr>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td style="padding-top: 15px;">Telephone Number:</td>
            </tr>
            <tr>
                <td><input type="tel"></td>
            </tr>
            <tr>
                <td style="padding-top: 15px;">Email:</td>
            </tr>
            <tr>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td style="padding-top: 15px;">Favorite Color:</td>
            </tr>
            <tr>
                <td><input type="color" value="#0000ff"></td>
            </tr>
            <tr>
                <td style="padding-top: 15px;">Date of Birth:</td>
            </tr>
            <tr>
                <td><input type="date" value="2015-07-16"></td>
            </tr>
            <tr>
                <td align="center" style="padding-top: 25px;">
                    <input type="submit" value="Submit">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
